<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
.hl{position:absolute;border:6px solid rgb(255,120,0);box-sizing:border-box}
</style></head><body><div class="hl" id="h"></div>
<script>
const q = new URLSearchParams(location.search), h = document.getElementById('h')
for (const [k, p] of [['x', 'left'], ['y', 'top'], ['w', 'width'], ['h', 'height']]) h.style[p] = (+q.get(k) || 0) + 'px'
</script></body></html>
